<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER KA BAAP!</title>
</head>
<body>
    <h1>Form For Registration</h1>
    <div>
    <label for="Username">Enter Your Username:</label>
    <input type="text" id="Username" name="Username" placeholder="Enter Your Username">
    </div>
    <div>
    <input type="radio" id="Male" name="Gender" value="Male">
    <label for="Male">Male</label>
    <input type="radio" name="Gender" id="Female" value="Female">
    <label for="Female">Female</label> 
    </div>
    <div>
        <input type="checkbox" name="Subscribe To My Channel" id="Subscribe" value="Subscribe">
        <label for="Subscribe">Subscribe To My Channel</label>
    </div>
    <div>Company For Work</div>
    <div>
      <select name="Company">
        <option value="Amazon">Amazon</option>
        <option value="Microsoft">Microsoft</option>
        <option value="Google">Google</option>
        <option value="Nvidia">Nvidia</option>
      </select>
    </div>
    <label for="Comment">Please Enter Your Comment:</label>
    <div>
       <textarea name="Comment" id="Comment" rows="4" cols="50">Enter Your Comment</textarea>
    </div>
    <div>Select your favourite fruit</div>
    <select name="fruit">
        <option value="Apple">Apple</option>
        <option value="Banana">Banana</option>
        <option value="Orange">Orange</option>
        <option value="Guava">Guava</option>
        <option value="Watermelon">Watermelon</option>
        <option value="Litchi">Litchi</option>
    </select>
</body>
</html
